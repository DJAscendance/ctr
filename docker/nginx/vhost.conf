# `Connection: upgrade` only when the client actually asked to upgrade -- sending it
# unconditionally breaks ordinary keep-alive requests through the same block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Re-resolve the upstream names instead of pinning them at startup.
#
# nginx resolves a literal hostname in `proxy_pass` ONCE, when it loads the config, and
# then holds that address for the life of the process. Every container replacement gives
# the service a new address on the compose network, so the address nginx is holding stops
# answering and it returns 502 -- permanently, until someone restarts nginx by hand.
#
# Reproduced 2026-08-29 on the beta stack: ct-api was recreated onto 172.23.0.6 while
# nginx still held 172.23.0.3, and four consecutive probes 20s apart all returned 502. It
# is not a transient window, so it is not something a redeploy waits out.
#
# 127.0.0.11 is Docker's embedded DNS, present in every container on a user-defined
# network. Putting the upstream in a variable is what makes nginx defer the lookup to
# request time; with a literal it would still resolve at startup even with a resolver set.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    #listen 443 ssl;
    listen 80;
    server_name localhost;
    root /var/www/cybertown;

    index index.html index.php;

    access_log off;
    error_log  /var/log/nginx/error.log error;

    location /api {
        set $ct_api http://ct-api:3000;
        # $request_uri is the original request line, so this passes the path and query
        # through unchanged -- the same thing the literal, URI-less form used to do.
        proxy_pass $ct_api$request_uri;
        proxy_http_version 1.1;

        # Home image uploads are multipart and the API accepts up to 5 MB
        # (IMAGE_FILESIZE_LIMIT in api/src/controllers/home.controller.ts). nginx's
        # built-in default is 1m, and nothing here raised it, so every upload between
        # 1 MB and 5 MB was refused by the proxy with nginx's own 413 page before the
        # request reached the API -- the app's limit and its error message were
        # unreachable. Keep this in step with IMAGE_FILESIZE_LIMIT.
        client_max_body_size 5m;

        # Same conditional as the socket block: this endpoint proxies plain JSON and
        # never upgrades, so an unconditional `Connection: upgrade` was a header the
        # request had not asked for.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /assets {
    	try_files /spa$uri $uri/; 
    }

    location /externprotos {
    	try_files /spa/assets$uri $uri/;
    }

    location / {

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        # Socket.IO lives behind this block, and its WebSocket upgrade needs HTTP/1.1
        # plus the Upgrade/Connection pair. Without them nginx answers the handshake
        # with 400 and every client silently falls back to HTTP long-polling: chat
        # still works, but on the transport that costs the most and is the most
        # sensitive to proxy read timeouts. The headers were present on `location
        # /api`, which proxies plain JSON and never upgrades, and absent here.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        set $ct_socket http://ct-socket:8000;
        proxy_pass $ct_socket$request_uri;
        proxy_redirect off;
    }



}

