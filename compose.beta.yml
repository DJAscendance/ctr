version: "3"
services:
    nginx:
        image: nginx:alpine
        expose:
            - "80"
        depends_on:
            - "ct-api"
            - "ct-socket"
        volumes:
            - ./:/var/www/cybertown
            - ./docker/nginx/vhost.conf:/etc/nginx/conf.d/cybertown.conf
        working_dir: /var/www/cybertown
        networks:
            - default
            - coolify
        labels:
            - traefik.enable=true
            - traefik.docker.network=coolify
            - traefik.http.routers.ctrbeta-http.rule=Host(`beta.cybertown.dev`)
            - traefik.http.routers.ctrbeta-http.entrypoints=http
            - traefik.http.routers.ctrbeta-http.middlewares=ctrbeta-redirect
            - traefik.http.middlewares.ctrbeta-redirect.redirectscheme.scheme=https
            - traefik.http.routers.ctrbeta-https.rule=Host(`beta.cybertown.dev`)
            - traefik.http.routers.ctrbeta-https.entrypoints=https
            - traefik.http.routers.ctrbeta-https.tls=true
            - traefik.http.routers.ctrbeta-https.tls.certresolver=letsencrypt
            - traefik.http.routers.ctrbeta-https.service=ctrbeta-svc
            - traefik.http.services.ctrbeta-svc.loadbalancer.server.port=80

    db:
        image: mysql:5.7
        expose:
            - "3306"
        volumes:
            - data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: cybertown

    ct-api:
        image: node:14
        depends_on:
            - "db"
        volumes:
            - ./api:/usr/src/app
            - ./spa:/usr/src/spa
        working_dir: /usr/src/app
        environment:
            NODE_ENV: production
            DB_HOST: db
            DB_PORT: 3306
            DB_USER: root
            DB_PASS: ${DB_ROOT_PASSWORD}
            DB_DATABASE: cybertown
            JWT_SECRET: ${JWT_SECRET}
            ASSETS_DIR: /usr/src/spa/assets
            CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL}
        command: bash -c "NPM_CONFIG_PRODUCTION=false npm install && node -r ts-node/register -r dotenv/config src/api.ts"

    ct-socket:
        image: node:14
        depends_on:
            - "db"
        volumes:
            - ./spa:/usr/src/app
        working_dir: /usr/src/app
        environment:
            NODE_ENV: production
            JWT_SECRET: ${JWT_SECRET}
            WEBSOCKET_PORT: 8000
            CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL}
            # Internal Docker-network address of ct-api, used by the home chat-access check.
            # Never reaches a browser: Traefik only routes to nginx.
            API_URL: http://ct-api:3000/api
        command: bash -c "NPM_CONFIG_PRODUCTION=false npm install && npm run build -- --mode production && node server.js"

    mailhog:
        image: mailhog/mailhog:latest
        logging:
            driver: "none"

volumes:
    data:

networks:
    default:
    coolify:
        external: true
