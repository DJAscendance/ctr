# CTR beta stack -- STANDALONE, not an overlay on docker-compose.yml.
#
# It is deployed as a normal Coolify Git-based Docker Compose application; Coolify owns the
# network, the Traefik routing and the environment. To run it by hand for local verification
# (nothing is published, so reach nginx from inside the network, e.g.
# `docker compose -f docker-compose.beta.yml exec nginx curl -sI localhost/`):
#
#   docker compose -f docker-compose.beta.yml up -d --build
#   docker compose -f docker-compose.beta.yml --profile bootstrap run --rm ct-bootstrap
#
# It used to be an overlay (`-f docker-compose.yml -f docker-compose.beta.yml`). That could
# not work for a public beta: compose MERGES the `ports` list rather than replacing it, so
# the beta inherited every development port the base file publishes and there is no
# override syntax that takes one away. Measured on the running stack, the beta was
# publishing the API (3000), its debugger (9229), the socket server (8000), its debugger
# (9230), MySQL (3360) and MailHog (1025/8025) in addition to the intended ingress. The
# same applies to `command:` and to the source bind mounts. A file that cannot subtract is
# the wrong shape for "production-like", so this one stands alone and states everything.
#
# What that buys, point by point:
#
#  * NO service publishes a host port. nginx is the only ingress and it is reachable on
#    container port 80 only; Coolify's Traefik routes beta.cybertown.dev to it, and Traefik
#    is what owns host 80/443. Everything else talks over the compose network by service
#    name. Publishing a port here would additionally expose the stack beside Traefik,
#    outside the proxy's TLS and Cloudflare's filter, so the ingress is `expose:` only.
#  * no debugger anywhere. `npm run dev` (API) and `npm run dev-server` (socket) both open
#    an inspector bound to 0.0.0.0; neither is used here.
#  * the API runs compiled JavaScript (`dist/api.js`), not ts-node.
#  * no service installs dependencies at start-up; the images do it from the lockfiles.
#  * no source bind mounts, so a container cannot be changed by editing the checkout, and
#    nothing running here can write back into the repository.
#  * MailHog is gone. It was never wired in: `api/src/libs/mail.ts` hard-codes
#    127.0.0.1:25 and the mailhog host/port lines next to it are commented out. Publishing
#    a mail UI for a service nothing sends to is pure exposure. Beta mail delivery is an
#    open question for the owner -- see docs/beta-integration-2026-08.md.
#
# Secrets come from the deployment platform's environment (Coolify's application environment
# in the beta deployment; a .env beside this file for a local run).
# The `:?` forms below are deliberate: the stack refuses to start rather than fall back to
# a development default on a public host.
services:
  nginx:
    build:
      context: .
      dockerfile: docker/beta/spa.Dockerfile
      target: web
    image: ctr-beta-web
    restart: unless-stopped
    depends_on:
      - ct-api
      - ct-socket
    expose:
      # The only ingress, and it is never published to the host. Coolify attaches this
      # service to its own network and points Traefik at container port 80.
      - "80"
    volumes:
      - object-assets:/var/www/cybertown/spa/assets/object
      - avatar-assets:/var/www/cybertown/spa/assets/avatars
      - home-image-assets:/var/www/cybertown/spa/assets/homes-uploads

  ct-api:
    build:
      context: .
      dockerfile: docker/beta/api.Dockerfile
      target: runtime
    image: ctr-beta-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASS: ${DB_PASS:?set DB_PASS}
      DB_DATABASE: ${DB_DATABASE:-cybertown}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ASSETS_DIR: /usr/src/spa/assets
      PRIVATE_UPLOADS_DIR: /usr/src/app/private-uploads
      CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL:-}
      # Public-beta policy. Every one of these defaults to CTR's existing behaviour, so a
      # deployment that sets none of them immigrates people immediately, runs no bot
      # challenge and links its mail at production -- exactly as before these existed.
      #
      # MEMBER_APPROVAL_REQUIRED holds every new immigration for a city administrator.
      MEMBER_APPROVAL_REQUIRED: ${MEMBER_APPROVAL_REQUIRED:-false}
      SITE_URL: ${SITE_URL:-}
      SITE_NAME: ${SITE_NAME:-}
      #
      # Turnstile is a PAIR, and the API needs to see both halves. It reads the SECRET to
      # verify a token, and the SITE key only to answer "is the browser being shown a
      # widget at all". Set both or set neither: with exactly one of them the API refuses
      # every immigration and logs which variable is missing. That is deliberate. The
      # earlier arrangement gave the API the secret alone, so a deployment with a site key
      # and no secret rendered a challenge in the browser and verified nothing on the
      # server -- protection that existed only where an automated caller could ignore it.
      #
      # TURNSTILE_SITE_KEY is publishable and is also given to ct-socket below, which
      # stamps it into the page. TURNSTILE_SECRET_KEY appears HERE ONLY and must never be
      # added to any service that talks to a browser.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      #
      # Mail transport. Unset, these fall back to a local MTA on 127.0.0.1:25, which is how
      # CTR's production host has always sent mail. That default cannot work in a container
      # -- 127.0.0.1 is the container, and no MTA runs inside this image -- so a
      # containerised deployment must point them at a real mail server.
      #
      # The CTNG Beta relays through the existing Cybertown mail host, which already serves
      # the cybertown.dev family: SMTP_HOST=mail.cybertown.dev, SMTP_PORT=587,
      # SMTP_SECURE=false. Port 587 is submission: the session starts in the clear and is
      # upgraded with STARTTLS, and setting SMTP_USER makes that upgrade mandatory, so the
      # password never crosses an unencrypted channel. Use SMTP_SECURE=true with port 465
      # for implicit TLS instead.
      #
      # SMTP_FROM must be an address the relay is allowed to sign for. Mail claiming a
      # domain the relay has no DKIM key for is treated as spam by the receiving side.
      #
      # SMTP_PASS is a server secret. It belongs to this service and no other, and it is
      # supplied from the deployment environment -- never written into this file.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - object-assets:/usr/src/spa/assets/object
      - avatar-assets:/usr/src/spa/assets/avatars
      - home-image-assets:/usr/src/spa/assets/homes-uploads
      # Home images awaiting moderation. Deliberately outside ASSETS_DIR and every
      # nginx-served path, so an unreviewed image cannot be fetched directly.
      - private-uploads:/usr/src/app/private-uploads

  ct-socket:
    build:
      context: .
      dockerfile: docker/beta/spa.Dockerfile
      target: socket
    image: ctr-beta-socket
    restart: unless-stopped
    depends_on:
      - ct-api
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      API_URL: http://ct-api:3000/api
      WEBSOCKET_PORT: "8000"
      CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL:-}
      # This service also serves index.html, so it -- not the API -- is where the browser's
      # view of the deployment comes from. SITE_MODE=beta turns on the landing page, the
      # BETA badge and the noindex policy together. Everything in these five lines is
      # PUBLIC: it is stamped into the page source every visitor receives, so no secret may
      # be added here. TURNSTILE_SITE_KEY is the publishable half of the Turnstile pair.
      SITE_MODE: ${SITE_MODE:-production}
      SITE_LABEL: ${SITE_LABEL:-}
      SITE_NOINDEX: ${SITE_NOINDEX:-}
      BUG_REPORT_URL: ${BUG_REPORT_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    volumes:
      - object-assets:/usr/src/app/assets/object
      - avatar-assets:/usr/src/app/assets/avatars
      - home-image-assets:/usr/src/app/assets/homes-uploads

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-cybertown}
      # MySQL will not accept "root" here; DB_USER must be an ordinary account.
      MYSQL_USER: ${DB_USER:?set DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS}
    volumes:
      - db-data:/var/lib/mysql

  # First-run only, and only when asked for by profile, so an ordinary `up` can never
  # start it. See docker/beta/bootstrap-db.sh for why the order it uses is what it is.
  ct-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: docker/beta/api.Dockerfile
      target: tooling
    image: ctr-beta-tooling
    restart: "no"
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASS: ${DB_PASS:?set DB_PASS}
      DB_DATABASE: ${DB_DATABASE:-cybertown}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}

volumes:
  # Runtime uploads. These outlive container replacement; the tracked defaults underneath
  # them are re-seeded on every start by docker/beta/seed-assets.sh, which never
  # overwrites a file that is already there.
  object-assets:
  avatar-assets:
  home-image-assets:
  private-uploads:
  db-data:
